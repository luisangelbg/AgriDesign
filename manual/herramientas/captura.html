<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>captura</title>
<!-- Herramienta interna del manual: abre la app en un marco, ejecuta una receta de pasos
     y deja la vista lista para una captura de pantalla con el navegador sin ventana.
     Uso (con el servidor local de la app en el puerto 8800):
       msedge --headless=new --hide-scrollbars --window-size=1400,860 --force-device-scale-factor=2
              --virtual-time-budget=30000 --screenshot=salida.png
              "http://localhost:8800/manual/herramientas/captura.html?w=1400&h=860&do=ex:0;step:5;run:anRun;scroll:%23anTable,16"
     Pasos: ex:N (carga el ejemplo N del Bloque 2, desde 0) · step:N · run:idBoton (espera a que el botón
            se vuelva a habilitar) · wait:ms · scroll:selector[,desfase] · click:selector · open:selector
            (abre un <details>) · select:selector=valor (elige una opción y dispara el cambio) ·
            set:selector=valor (escribe en un campo y dispara input/change) · check:selector=true|false ·
            cfg:figura.clave=valor (opción del editor de una figura, y la redibuja) · hide:selector ·
            frame:selector (un iframe de la app, como la vista previa del informe, crece a la altura de su página) ·
            style:selector=css (añade estilo en línea, p. ej. style:%23transTable%20table=font-size:12px) · scrollin:iframe|elemento,desfase · top · report|elemento,desfase · top · report (al final: la página se vuelve el informe del
            Bloque 7, para imprimirlo con --print-to-pdf). En la dirección, # se escribe %23 y la coma %2C. -->
<style>html,body{margin:0;overflow:hidden;background:#fff}iframe{border:0;display:block;position:absolute;left:0;top:0}</style>
</head>
<body>
<iframe id="app"></iframe>
<script>
(async function () {
  const p = new URLSearchParams(location.search);
  const f = document.getElementById('app');
  /* The tool and the app share the origin, so the language and the theme are fixed here,
     before the app boots: Spanish and light theme unless the address says otherwise
     (?lang=en, ?theme=dark). Without this, a headless browser would open it in English. */
  try {
    localStorage.setItem('agridesign:lang', p.get('lang') || 'es');
    localStorage.setItem('agridesign:theme', p.get('theme') || 'light');
  } catch (e) { /* private browsing */ }
  f.src = '../../index.html';
  f.style.width = (p.get('w') || 1400) + 'px';
  f.style.height = (p.get('h') || 860) + 'px';
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  const w = f.contentWindow, d = f.contentDocument;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const q = s => d.querySelector(decodeURIComponent(s));
  const tall = async () => { f.style.height = Math.max(+(p.get('h') || 860), d.documentElement.scrollHeight + 50) + 'px'; await sleep(300); };
  await sleep(600);
  for (const raw of (p.get('do') || '').split(';').filter(Boolean)) {
    const i = raw.indexOf(':');
    const cmd = i < 0 ? raw : raw.slice(0, i), arg = i < 0 ? '' : raw.slice(i + 1);
    if (cmd === 'ex') { d.querySelectorAll('.example-btn')[+arg].click(); await sleep(1800); }
    else if (cmd === 'step') { w.goStep(+arg); await sleep(1200); }
    else if (cmd === 'run') { q('#' + arg).click(); await sleep(400); for (let k = 0; k < 2400 && q('#' + arg).disabled; k++) await sleep(250); await sleep(900); }
    else if (cmd === 'wait') await sleep(+arg);
    else if (cmd === 'scroll') {
      /* screenshots without a window do not follow scrolling inside a frame: the frame is
         made as tall as the page and slid up behind the visible area instead */
      const [sel, off] = arg.split(',');
      await tall();
      const y = q(sel).getBoundingClientRect().top + w.scrollY - (+off || 12);
      f.style.top = -Math.max(0, y) + 'px'; await sleep(500);
    }
    else if (cmd === 'click') { q(arg).click(); await sleep(700); }
    else if (cmd === 'open') { q(arg).open = true; await sleep(500); }
    else if (cmd === 'select') { const [sel, val] = arg.split('='); const n = q(sel); n.value = decodeURIComponent(val); n.dispatchEvent(new Event('change')); await sleep(700); }
    else if (cmd === 'set') { const [sel, val] = arg.split('='); const n = q(sel); n.value = decodeURIComponent(val); n.dispatchEvent(new Event('input')); n.dispatchEvent(new Event('change')); await sleep(400); }
    else if (cmd === 'check') { const [sel, val] = arg.split('='); const n = q(sel); n.checked = val !== 'false'; n.dispatchEvent(new Event('change')); await sleep(400); }
    else if (cmd === 'cfg') {
      const [lhs, ...rest] = arg.split('='); const val = rest.join('=');
      const [id, key] = lhs.split('.');
      const api = w.Fig.registry[id];
      if (api) { api.cfg[key] = /^-?\d+(\.\d+)?$/.test(val) ? +val : val === 'true' ? true : val === 'false' ? false : decodeURIComponent(val); api.redraw(); }
      await sleep(500);
    }
    else if (cmd === 'style') { const [sel, css] = arg.split('='); d.querySelectorAll(decodeURIComponent(sel)).forEach(n => { n.style.cssText += ';' + decodeURIComponent(css); }); await sleep(300); }
    else if (cmd === 'hide') { d.querySelectorAll(decodeURIComponent(arg)).forEach(n => { n.style.display = 'none'; }); await sleep(300); }
    else if (cmd === 'frame') { const fr = q(arg); await sleep(600); fr.style.height = (fr.contentDocument.documentElement.scrollHeight + 24) + 'px'; await sleep(600); }
    else if (cmd === 'scrollin') {
      const [sels, off] = arg.split(','); const [frSel, inSel] = sels.split('|');
      const fr = q(frSel), target = fr.contentDocument.querySelector(decodeURIComponent(inSel));
      await tall();
      const y = fr.getBoundingClientRect().top + w.scrollY + target.getBoundingClientRect().top - (+off || 12);
      f.style.top = -Math.max(0, y) + 'px'; await sleep(500);
    }
    else if (cmd === 'top') { w.scrollTo(0, 0); await sleep(300); }
    else if (cmd === 'report') {
      const html = w.Report.build(w.B7.opts());
      document.open(); document.write(html); document.close();
      return;
    }
  }
  document.title = 'ready';
})();
</script>
</body>
</html>
